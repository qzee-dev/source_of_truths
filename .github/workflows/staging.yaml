name: Deploy Staging

on:
  workflow_dispatch:
    inputs:

      release_run_id:
        description: Release Workflow Run ID
        required: true
        type: string

      release_id:
        description: Release ID From Release Workflow
        required: true
        type: string

      service:
        description: Service To Deploy
        required: true
        type: choice
        options:
          - api-gateway
          - user-service
          - payment-service
          - wallet-service
          - transaction-service
          - notification-service
          - fraud-service

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: staging-${{ inputs.service }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:

  deploy:

    name: Deploy And Test Staging

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      #################################################
      # Checkout
      #################################################

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #################################################
      # Download Release Metadata
      #################################################

      - name: Download Release Metadata
        uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.release_id }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}

      #################################################
      # AWS Authentication
      #################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      #################################################
      # Read Release Metadata
      #################################################

      - name: Read Release Metadata
        shell: bash
        run: |

          set -euo pipefail

          SERVICE=$(cat release/service.txt)
          VERSION=$(cat release/version.txt)
          IMAGE_TAG=$(cat release/image-tag.txt)
          DIGEST=$(cat release/digest.txt)
          COMMIT=$(cat release/commit.txt)
          RELEASE_ID=$(cat release/release-id.txt)
          RELEASE_RUN_ID=$(cat release/release-run-id.txt)

          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "RELEASE_RUN_ID=$RELEASE_RUN_ID" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Release Metadata"
          echo "======================================"
          echo "Release ID     : $RELEASE_ID"
          echo "Release Run ID : $RELEASE_RUN_ID"
          echo "Service        : $SERVICE"
          echo "Version        : $VERSION"
          echo "Image Tag      : $IMAGE_TAG"
          echo "Commit         : $COMMIT"
          echo "Digest         : $DIGEST"
          echo "======================================"

      #################################################
      # Validate Release Identity
      #################################################

      - name: Validate Release Identity
        shell: bash
        run: |

          set -euo pipefail

          if [[ "$RELEASE_ID" != "${{ inputs.release_id }}" ]]; then
            echo "ERROR: Release ID mismatch."
            echo "Expected: ${{ inputs.release_id }}"
            echo "Actual  : $RELEASE_ID"
            exit 1
          fi

          if [[ "$RELEASE_RUN_ID" != "${{ inputs.release_run_id }}" ]]; then
            echo "ERROR: Release Run ID mismatch."
            echo "Expected: ${{ inputs.release_run_id }}"
            echo "Actual  : $RELEASE_RUN_ID"
            exit 1
          fi

          if [[ "$SERVICE" != "${{ inputs.service }}" ]]; then
            echo "ERROR: Service mismatch."
            echo "Expected: ${{ inputs.service }}"
            echo "Actual  : $SERVICE"
            exit 1
          fi

          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid image digest."
            exit 1
          fi

          echo "Release identity validated."

      #################################################
      # Verify Source Commit
      #################################################

      - name: Verify Source Commit
        shell: bash
        run: |

          set -euo pipefail

          git cat-file -e "$COMMIT^{commit}"

          echo "Source commit exists:"
          echo "$COMMIT"

      #################################################
      # Verify Image Exists In ECR
      #################################################

      - name: Verify ECR Image
        shell: bash
        run: |

          set -euo pipefail

          VERIFIED_DIGEST=$(aws ecr describe-images \
            --repository-name "$SERVICE" \
            --image-ids imageDigest="$DIGEST" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ -z "$VERIFIED_DIGEST" || "$VERIFIED_DIGEST" == "None" ]]; then
            echo "ERROR: Image digest does not exist in ECR."
            echo "$SERVICE@$DIGEST"
            exit 1
          fi

          if [[ "$VERIFIED_DIGEST" != "$DIGEST" ]]; then
            echo "ERROR: ECR digest mismatch."
            echo "Expected: $DIGEST"
            echo "Actual  : $VERIFIED_DIGEST"
            exit 1
          fi

          echo "ECR image verified:"
          echo "$SERVICE@$DIGEST"

      #################################################
      # Verify Image Tag
      #################################################

      - name: Verify Image Tag
        shell: bash
        run: |

          set -euo pipefail

          TAG_DIGEST=$(aws ecr describe-images \
            --repository-name "$SERVICE" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ "$TAG_DIGEST" != "$DIGEST" ]]; then
            echo "ERROR: Image tag does not point to release digest."
            echo "Tag digest     : $TAG_DIGEST"
            echo "Release digest : $DIGEST"
            exit 1
          fi

          echo "Image tag verified."

      #################################################
      # Configure Kubectl
      #################################################

      - name: Configure Kubectl
        shell: bash
        run: |

          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name fintech-staging

      #################################################
      # Deploy Exact Digest
      #################################################

      - name: Deploy To Staging
        shell: bash
        run: |

          set -euo pipefail

          helm upgrade fintech ./helm \
            --install \
            --namespace staging \
            --create-namespace \
            --set image.repository="$SERVICE" \
            --set image.digest="$DIGEST"

      #################################################
      # Verify Rollout
      #################################################

      - name: Verify Rollout
        shell: bash
        run: |

          set -euo pipefail

          kubectl rollout status \
            deployment/"$SERVICE" \
            --namespace staging \
            --timeout=10m

      #################################################
      # Verify Deployed Digest
      #################################################

      - name: Verify Deployed Digest
        shell: bash
        run: |

          set -euo pipefail

          EXPECTED_IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${SERVICE}@${DIGEST}"

          DEPLOYED_IMAGE=$(kubectl get deployment "$SERVICE" \
            --namespace staging \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          echo "Expected:"
          echo "$EXPECTED_IMAGE"

          echo "Deployed:"
          echo "$DEPLOYED_IMAGE"

          if [[ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo "ERROR: Staging deployment does not reference approved digest."
            exit 1
          fi

      #################################################
      # Smoke Tests
      #################################################

      - name: Smoke Tests
        shell: bash
        run: |

          set -euo pipefail

          ./tests/smoke.sh

      #################################################
      # Integration Tests
      #################################################

      - name: Integration Tests
        shell: bash
        run: |

          set -euo pipefail

          ./tests/integration.sh

      #################################################
      # DAST
      #################################################

      - name: DAST
        shell: bash
        run: |

          set -euo pipefail

          ./tests/dast.sh

      #################################################
      # Staging Summary
      #################################################

      - name: Staging Deployment Summary
        run: |

          echo ""
          echo "=============================================="
          echo "STAGING DEPLOYMENT SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "Release ID:"
          echo "$RELEASE_ID"
          echo ""
          echo "Release Run ID:"
          echo "$RELEASE_RUN_ID"
          echo ""
          echo "Service:"
          echo "$SERVICE"
          echo ""
          echo "Version:"
          echo "$VERSION"
          echo ""
          echo "Build Tag:"
          echo "$IMAGE_TAG"
          echo ""
          echo "Commit:"
          echo "$COMMIT"
          echo ""
          echo "Immutable Digest:"
          echo "$DIGEST"
          echo ""
          echo "Tests:"
          echo "  ✓ Rollout"
          echo "  ✓ Smoke"
          echo "  ✓ Integration"
          echo "  ✓ DAST"
          echo ""
          echo "=============================================="
          echo "READY FOR PRODUCTION"
          echo "=============================================="
