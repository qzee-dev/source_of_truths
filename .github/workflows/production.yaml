name: Deploy Production

on:
  workflow_dispatch:
    inputs:

      release_run_id:
        description: Release Workflow Run ID
        required: true
        type: string

      release_id:
        description: Release ID From Release Workflow
        required: true
        type: string

      service:
        description: Service To Deploy
        required: true
        type: choice
        options:
          - api-gateway
          - user-service
          - payment-service
          - wallet-service
          - transaction-service
          - notification-service
          - fraud-service

      version:
        description: Approved Release Version
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: production-${{ inputs.service }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SOURCE_REPOSITORY: YOUR_ORG/YOUR-SOURCE-REPO
  GITOPS_REPOSITORY: YOUR_ORG/YOUR-GITOPS-REPO

  # Argo CD
  ARGOCD_SERVER: YOUR_ARGOCD_SERVER
  ARGOCD_APP_PREFIX: production

jobs:

  promote:

    name: Promote And Deploy Production

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      #################################################
      # Checkout Production Repository
      #################################################

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #################################################
      # Checkout GitOps Repository
      #################################################

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0

      #################################################
      # Download Release Metadata
      #################################################

      - name: Download Release Metadata
        uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.release_id }}
          path: release
          github-token: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          repository: ${{ env.SOURCE_REPOSITORY }}
          run-id: ${{ inputs.release_run_id }}

      #################################################
      # AWS Authentication
      #################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      #################################################
      # Read Release Metadata
      #################################################

      - name: Read Release Metadata
        shell: bash
        run: |

          set -euo pipefail

          RELEASE_FILE="release/release.json"

          if [[ ! -f "$RELEASE_FILE" ]]; then
            echo "ERROR: Release metadata file not found:"
            echo "$RELEASE_FILE"
            exit 1
          fi

          SERVICE=$(jq -r '.service' "$RELEASE_FILE")
          VERSION=$(jq -r '.version' "$RELEASE_FILE")
          IMAGE_TAG=$(jq -r '.image_tag' "$RELEASE_FILE")
          DIGEST=$(jq -r '.digest' "$RELEASE_FILE")
          COMMIT=$(jq -r '.commit' "$RELEASE_FILE")
          RELEASE_ID=$(jq -r '.release_id' "$RELEASE_FILE")
          RELEASE_RUN_ID=$(jq -r '.release_run_id' "$RELEASE_FILE")
          SOURCE_REPOSITORY=$(jq -r '.source_repository // empty' "$RELEASE_FILE")

          if [[ -z "$SERVICE" || "$SERVICE" == "null" ]]; then
            echo "ERROR: Missing service in release metadata."
            exit 1
          fi

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "ERROR: Missing version in release metadata."
            exit 1
          fi

          if [[ -z "$IMAGE_TAG" || "$IMAGE_TAG" == "null" ]]; then
            echo "ERROR: Missing image tag in release metadata."
            exit 1
          fi

          if [[ -z "$DIGEST" || "$DIGEST" == "null" ]]; then
            echo "ERROR: Missing digest in release metadata."
            exit 1
          fi

          if [[ -z "$COMMIT" || "$COMMIT" == "null" ]]; then
            echo "ERROR: Missing commit in release metadata."
            exit 1
          fi

          if [[ -z "$RELEASE_ID" || "$RELEASE_ID" == "null" ]]; then
            echo "ERROR: Missing release ID in release metadata."
            exit 1
          fi

          if [[ -z "$RELEASE_RUN_ID" || "$RELEASE_RUN_ID" == "null" ]]; then
            echo "ERROR: Missing release run ID in release metadata."
            exit 1
          fi

          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "RELEASE_RUN_ID=$RELEASE_RUN_ID" >> "$GITHUB_ENV"
          echo "SOURCE_REPOSITORY_FROM_METADATA=$SOURCE_REPOSITORY" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Release Metadata"
          echo "======================================"
          echo "Release ID     : $RELEASE_ID"
          echo "Release Run ID : $RELEASE_RUN_ID"
          echo "Service        : $SERVICE"
          echo "Version        : $VERSION"
          echo "Image Tag      : $IMAGE_TAG"
          echo "Commit         : $COMMIT"
          echo "Digest         : $DIGEST"
          echo "Source Repo    : ${SOURCE_REPOSITORY:-not specified}"
          echo "======================================"

      #################################################
      # Validate Release Identity
      #################################################

      - name: Validate Release Identity
        shell: bash
        run: |

          set -euo pipefail

          if [[ "$RELEASE_ID" != "${{ inputs.release_id }}" ]]; then
            echo "ERROR: Release ID mismatch."
            exit 1
          fi

          if [[ "$RELEASE_RUN_ID" != "${{ inputs.release_run_id }}" ]]; then
            echo "ERROR: Release Run ID mismatch."
            exit 1
          fi

          if [[ "$SERVICE" != "${{ inputs.service }}" ]]; then
            echo "ERROR: Service mismatch."
            exit 1
          fi

          if [[ "$VERSION" != "${{ inputs.version }}" ]]; then
            echo "ERROR: Version mismatch."
            exit 1
          fi

          if [[ -n "$SOURCE_REPOSITORY_FROM_METADATA" &&
                "$SOURCE_REPOSITORY_FROM_METADATA" != "$SOURCE_REPOSITORY" ]]; then
            echo "ERROR: Source repository mismatch."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release version."
            exit 1
          fi

          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid image digest."
            exit 1
          fi

          if [[ ! "$COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "ERROR: Invalid source commit SHA."
            exit 1
          fi

          echo "Release identity validated."

      #################################################
      # Verify Source Commit
      #################################################

      - name: Verify Source Commit
        shell: bash
        run: |

          set -euo pipefail

          git fetch \
            "https://github.com/${SOURCE_REPOSITORY}.git" \
            "$COMMIT" \
            --depth=1

          git cat-file -e "$COMMIT^{commit}"

          echo "Source commit verified:"
          echo "$COMMIT"

      #################################################
      # Verify ECR Repository
      #################################################

      - name: Verify ECR Repository
        shell: bash
        run: |

          set -euo pipefail

          aws ecr describe-repositories \
            --repository-names "$SERVICE" \
            --region "$AWS_REGION" \
            > /dev/null

          echo "ECR repository verified:"
          echo "$SERVICE"

      #################################################
      # Verify ECR Tag Immutability
      #################################################

      - name: Verify ECR Tag Immutability
        shell: bash
        run: |

          set -euo pipefail

          MUTABILITY=$(aws ecr describe-repositories \
            --repository-names "$SERVICE" \
            --region "$AWS_REGION" \
            --query 'repositories[0].imageTagMutability' \
            --output text)

          echo "ECR tag mutability: $MUTABILITY"

          if [[ "$MUTABILITY" != "IMMUTABLE" ]]; then
            echo "ERROR: ECR repository must use IMMUTABLE image tags."
            exit 1
          fi

      #################################################
      # Verify Exact Digest
      #################################################

      - name: Verify ECR Digest
        shell: bash
        run: |

          set -euo pipefail

          VERIFIED_DIGEST=$(aws ecr describe-images \
            --repository-name "$SERVICE" \
            --image-ids imageDigest="$DIGEST" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ "$VERIFIED_DIGEST" != "$DIGEST" ]]; then
            echo "ERROR: ECR digest mismatch."
            echo "Expected: $DIGEST"
            echo "Actual  : $VERIFIED_DIGEST"
            exit 1
          fi

          echo "Approved digest verified:"
          echo "$SERVICE@$DIGEST"

      #################################################
      # Verify Build Tag
      #################################################

      - name: Verify Build Tag
        shell: bash
        run: |

          set -euo pipefail

          TAG_DIGEST=$(aws ecr describe-images \
            --repository-name "$SERVICE" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ "$TAG_DIGEST" != "$DIGEST" ]]; then
            echo "ERROR: Build tag does not point to approved digest."
            echo "Tag digest     : $TAG_DIGEST"
            echo "Approved digest: $DIGEST"
            exit 1
          fi

          echo "Build tag verified:"
          echo "$SERVICE:$IMAGE_TAG"
          echo "$SERVICE@$DIGEST"

      #################################################
      # Production Approval
      #################################################

      - name: Production Approval
        run: |

          echo "Production environment approval has been granted."
          echo "Release: $RELEASE_ID"
          echo "Digest : $DIGEST"

      #################################################
      # Create Production Version Tag
      #################################################

      - name: Create Production Release Tag
        shell: bash
        run: |

          set -euo pipefail

          EXISTING_DIGEST=$(aws ecr describe-images \
            --repository-name "$SERVICE" \
            --image-ids imageTag="$VERSION" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)

          if [[ -n "$EXISTING_DIGEST" && "$EXISTING_DIGEST" != "None" ]]; then

            if [[ "$EXISTING_DIGEST" != "$DIGEST" ]]; then
              echo "ERROR: Production version already points to another digest."
              echo "Version         : $VERSION"
              echo "Existing digest : $EXISTING_DIGEST"
              echo "Approved digest : $DIGEST"
              exit 1
            fi

            echo "Production version already points to approved digest."
            exit 0
          fi

          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$SERVICE" \
            --image-ids imageDigest="$DIGEST" \
            --region "$AWS_REGION" \
            --query 'images[0].imageManifest' \
            --output text)

          if [[ -z "$MANIFEST" || "$MANIFEST" == "None" ]]; then
            echo "ERROR: Unable to retrieve image manifest."
            exit 1
          fi

          aws ecr put-image \
            --repository-name "$SERVICE" \
            --image-tag "$VERSION" \
            --image-manifest "$MANIFEST" \
            --region "$AWS_REGION"

      #################################################
      # Verify Production Tag
      #################################################

      - name: Verify Production Tag
        shell: bash
        run: |

          set -euo pipefail

          PRODUCTION_DIGEST=$(aws ecr describe-images \
            --repository-name "$SERVICE" \
            --image-ids imageTag="$VERSION" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ "$PRODUCTION_DIGEST" != "$DIGEST" ]]; then
            echo "ERROR: Production tag does not point to approved digest."
            echo "Expected: $DIGEST"
            echo "Actual  : $PRODUCTION_DIGEST"
            exit 1
          fi

          echo "Production tag verified:"
          echo "$SERVICE:$VERSION"
          echo "$SERVICE@$DIGEST"

      #################################################
      # GitOps Promotion
      #################################################

      - name: Update Production GitOps Image
        shell: bash
        run: |

          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path
          import re

          service = os.environ["SERVICE"]
          image_tag = os.environ["IMAGE_TAG"]
          digest = os.environ["DIGEST"]

          file = Path(
              f"gitops/environments/production/{service}/values.yaml"
          )

          if not file.exists():
              raise SystemExit(
                  f"GitOps values file does not exist: {file}"
              )

          text = file.read_text()

          text, tag_count = re.subn(
              r'(^\s*tag:\s*")[^"]*(")',
              rf'\g<1>{image_tag}\g<2>',
              text,
              count=1,
              flags=re.MULTILINE
          )

          text, digest_count = re.subn(
              r'(^\s*digest:\s*")[^"]*(")',
              rf'\g<1>{digest}\g<2>',
              text,
              count=1,
              flags=re.MULTILINE
          )

          if tag_count != 1:
              raise SystemExit(
                  f"Could not update image tag in {file}"
              )

          if digest_count != 1:
              raise SystemExit(
                  f"Could not update image digest in {file}"
              )

          file.write_text(text)

          print(f"Updated: {file}")
          print(f"Tag    : {image_tag}")
          print(f"Digest : {digest}")
          PY

      #################################################
      # Verify GitOps Changes
      #################################################

      - name: Verify GitOps Changes
        working-directory: gitops
        shell: bash
        run: |

          set -euo pipefail

          FILE="environments/production/${SERVICE}/values.yaml"

          echo "GitOps file:"
          echo "$FILE"

          git diff -- "$FILE"

          if git diff --quiet -- "$FILE"; then
            echo "ERROR: No GitOps changes detected."
            exit 1
          fi

          echo "GitOps changes detected."

      #################################################
      # Commit And Push Production GitOps Changes
      #################################################

      - name: Commit Production GitOps Promotion
        working-directory: gitops
        shell: bash
        run: |

          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "environments/production/${SERVICE}/values.yaml"

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit \
            -m "promote ${SERVICE} ${IMAGE_TAG} to production"

          git push

          GITOPS_COMMIT=$(git rev-parse HEAD)

          echo "GITOPS_COMMIT=$GITOPS_COMMIT" >> "$GITHUB_ENV"

          echo "GitOps commit:"
          echo "$GITOPS_COMMIT"

      #################################################
      # Install Argo CD CLI
      #################################################

      - name: Install Argo CD CLI
        shell: bash
        run: |

          set -euo pipefail

          curl -sSL \
            -o /tmp/argocd \
            "https://${ARGOCD_SERVER}/download/argocd-linux-amd64"

          install -m 0755 \
            /tmp/argocd \
            "$HOME/.local/bin/argocd"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          argocd version --client

      #################################################
      # Configure Argo CD Authentication
      #################################################

      - name: Configure Argo CD Authentication
        shell: bash
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |

          set -euo pipefail

          if [[ -z "$ARGOCD_AUTH_TOKEN" ]]; then
            echo "ERROR: ARGOCD_AUTH_TOKEN is not configured."
            exit 1
          fi

          echo "Argo CD authentication configured."

      #################################################
      # Determine Argo CD Application
      #################################################

      - name: Determine Argo CD Application
        shell: bash
        run: |

          set -euo pipefail

          ARGOCD_APP="${ARGOCD_APP_PREFIX}-${SERVICE}"

          echo "ARGOCD_APP=$ARGOCD_APP" >> "$GITHUB_ENV"

          echo "Argo CD application:"
          echo "$ARGOCD_APP"

      #################################################
      # Wait For Argo CD Deployment
      #################################################

      - name: Wait For Argo CD Deployment
        shell: bash
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |

          set -euo pipefail

          echo "Waiting for Argo CD to synchronize:"
          echo "$ARGOCD_APP"

          argocd app wait "$ARGOCD_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --sync \
            --health \
            --timeout 600

          echo "Argo CD deployment is synchronized and healthy."

      #################################################
      # Verify Argo CD Application
      #################################################

      - name: Verify Argo CD Application
        shell: bash
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |

          set -euo pipefail

          STATUS=$(argocd app get "$ARGOCD_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            -o json)

          SYNC_STATUS=$(echo "$STATUS" | jq -r '.status.sync.status')
          HEALTH_STATUS=$(echo "$STATUS" | jq -r '.status.health.status')
          REVISION=$(echo "$STATUS" | jq -r '.status.sync.revision')

          echo "Argo CD Application:"
          echo "Application : $ARGOCD_APP"
          echo "Sync        : $SYNC_STATUS"
          echo "Health      : $HEALTH_STATUS"
          echo "Revision    : $REVISION"

          if [[ "$SYNC_STATUS" != "Synced" ]]; then
            echo "ERROR: Argo CD application is not Synced."
            exit 1
          fi

          if [[ "$HEALTH_STATUS" != "Healthy" ]]; then
            echo "ERROR: Argo CD application is not Healthy."
            exit 1
          fi

          echo "Argo CD application verified."

      #################################################
      # Verify GitOps Revision
      #################################################

      - name: Verify GitOps Revision
        shell: bash
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |

          set -euo pipefail

          REVISION=$(argocd app get "$ARGOCD_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            -o json \
            | jq -r '.status.sync.revision')

          echo "Expected GitOps commit:"
          echo "$GITOPS_COMMIT"

          echo "Argo CD synced revision:"
          echo "$REVISION"

          if [[ "$REVISION" != "$GITOPS_COMMIT" ]]; then
            echo "ERROR: Argo CD is not synchronized to the expected GitOps commit."
            exit 1
          fi

          echo "Argo CD revision verified."

      #################################################
      # Store Release History
      #################################################

      - name: Store Release History
        working-directory: gitops
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p release-history

          cat <<EOF > "release-history/${SERVICE}-${VERSION}.json"
          {
            "release_id": "${RELEASE_ID}",
            "release_run_id": "${RELEASE_RUN_ID}",
            "service": "${SERVICE}",
            "version": "${VERSION}",
            "image_tag": "${IMAGE_TAG}",
            "digest": "${DIGEST}",
            "source_commit": "${COMMIT}",
            "gitops_commit": "${GITOPS_COMMIT}",
            "argocd_application": "${ARGOCD_APP}",
            "environment": "production",
            "approved_by": "${{ github.actor }}",
            "production_workflow_run_id": "${GITHUB_RUN_ID}",
            "production_workflow_run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "deployed_at": "$(date -u +%FT%TZ)"
          }
          EOF

      #################################################
      # Commit Release History
      #################################################

      - name: Commit Release Metadata
        working-directory: gitops
        shell: bash
        run: |

          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add release-history

          if git diff --cached --quiet; then
            echo "No release history changes to commit."
            exit 0
          fi

          git commit \
            -m "release ${SERVICE} ${VERSION}"

          git push

      #################################################
      # Production Summary
      #################################################

      - name: Production Deployment Summary
        run: |

          echo ""
          echo "=============================================="
          echo "PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "Release ID:"
          echo "$RELEASE_ID"
          echo ""
          echo "Release Run ID:"
          echo "$RELEASE_RUN_ID"
          echo ""
          echo "Service:"
          echo "$SERVICE"
          echo ""
          echo "Human Version:"
          echo "$VERSION"
          echo ""
          echo "Build Tag:"
          echo "$IMAGE_TAG"
          echo ""
          echo "Source Commit:"
          echo "$COMMIT"
          echo ""
          echo "Immutable Digest:"
          echo "$DIGEST"
          echo ""
          echo "GitOps Commit:"
          echo "$GITOPS_COMMIT"
          echo ""
          echo "Argo CD Application:"
          echo "$ARGOCD_APP"
          echo ""
          echo "Approved By:"
          echo "${{ github.actor }}"
          echo ""
          echo "=============================================="
          echo "BUILD ONCE"
          echo "PROMOTE SAME DIGEST"
          echo "NO REBUILD"
          echo "GITOPS DEPLOYMENT"
          echo "ARGO CD VERIFIED"
          echo "=============================================="
